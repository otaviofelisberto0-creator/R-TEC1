<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard TEC1</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>:root{--r:#c90032;--d:#690019;--i:#14233b;--l:#d9bcc4}*{box-sizing:border-box}body{margin:0;font:16px/1.45 "Segoe UI",Arial;background:#f4f6f9;color:var(--i)}header{min-height:78px;padding:14px 22px;background:linear-gradient(110deg,#620017,var(--r));color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-size:30px;font-weight:900}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 78px)}nav{background:#fff;border-right:1px solid var(--l);padding:14px}nav a{display:block;margin-bottom:10px;padding:13px;border-radius:9px;background:#fff1f4;color:var(--d);font-size:16px;font-weight:800;text-decoration:none}main{min-width:0;padding:22px}h1{font-size:29px}.block,.card,.kpi{background:#fff;border:1px solid var(--l);border-radius:14px;padding:17px;margin-bottom:14px}.block h2{font-size:19px;margin:0 0 12px}.filters{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:13px}label{font-size:14px;font-weight:800}select,button{width:100%;min-height:48px;margin-top:6px;padding:10px 12px;border:2px solid #c69da8;border-radius:9px;background:#fff;font-size:16px}button{background:var(--d);color:#fff;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpi{border-top:6px solid var(--r)}.kpi small{font-size:16px;font-weight:800}.kpi b{display:block;font-size:38px;margin-top:8px}.chart{height:510px}.tableWrap{overflow:auto}.matrix{border-collapse:collapse;min-width:1200px;width:100%;font-size:14px}.matrix th{background:var(--r);color:#fff;padding:12px}.matrix td{padding:10px;border-bottom:1px solid #ddd;text-align:center}.empty{font-size:18px;font-weight:700;text-align:center;padding:35px}.competencia{width:auto;min-width:210px}@media(max-width:760px){.layout{display:block}nav{display:flex;overflow:auto}nav a{min-width:max-content;margin-right:8px}.filters{grid-template-columns:1fr}.kpis{display:flex;overflow:auto}.kpi{min-width:250px}.brand{font-size:23px}main{padding:11px}}</style></head><body><header><div class="brand">Dashboard TEC1</div><select id="competencia" class="competencia"><option>Carregando...</option></select></header><div class="layout"><nav><a href="./index.html">▣ Dashboard</a><a href="#historico">▤ Histórico</a><a href="./admin.html">⚙ Admin</a></nav><main><h1>Análise diária TEC1</h1><section class="block"><h2>Filtros de serviço</h2><div class="filters"><label>Grupo OS<select id="fOS"></select></label><label>Tipo de Instalação<select id="fTipo"><option value="TODOS">Todos</option><option value="ADESAO">ADESÃO</option><option value="MIGRACAO">MIGRAÇÃO</option></select></label></div></section><section class="block"><h2>Filtros operacionais interligados</h2><div class="filters"><label>Grupo<select id="fGrupo"></select></label><label>Cluster<select id="fCluster"></select></label><label>SubCluster<select id="fSub"></select></label><label>Cidade<select id="fCidade"></select></label><label>UN<select id="fUn"></select></label><label>EPO<select id="fEpo"></select></label><label><span>Ações</span><button id="reset">Limpar filtros</button></label></div></section><section id="kpis" class="kpis"></section><div id="content"></div></main></div><script>let ALL=[];const $=s=>document.querySelector(s),dims=[['fOS','grupoOS'],['fTipo','tipoInstalacao'],['fGrupo','regional'],['fCluster','cluster'],['fSub','subcluster'],['fCidade','cidade'],['fUn','un'],['fEpo','epo']],P=(a,b)=>b?100*a/b:null,PP=v=>v==null?'-':v.toFixed(1).replace('.',',')+'%';function state(){return Object.fromEntries(dims.map(([i,f])=>[f,$('#'+i).value||'TODOS']))}function match(r,s,skip){return dims.every(([,f])=>f===skip||s[f]==='TODOS'||r[f]===s[f])}function fill(){let s=state();for(const[id,f]of dims){if(f==='tipoInstalacao')continue;let e=$('#'+id),old=e.value||'TODOS',v=[...new Set(ALL.filter(r=>match(r,s,f)).map(r=>r[f]).filter(Boolean))].sort();e.innerHTML='<option value="TODOS">Todos</option>'+v.map(x=>`<option>${x}</option>`).join('');e.value=v.includes(old)?old:'TODOS'}$('#fTipo').disabled=false}function render(){fill();let s=state(),r=ALL.filter(x=>match(x,s)),groups=['RPS','Grupo SC','Grupo PR'];$('#kpis').innerHTML=groups.map(g=>{let q=g==='RPS'?r:r.filter(x=>x.regional===g),v=P(q.reduce((a,x)=>a+(+x.padrao||0),0),q.reduce((a,x)=>a+(+x.totalOS||0),0));return `<div class="kpi"><small>${g} x % TEC1</small><b>${PP(v)}</b></div>`}).join('');$('#content').innerHTML=r.length?'<section class="card" id="historico"><h2>Dados carregados</h2><div class="tableWrap"><table class="matrix"><tr><th>Registros filtrados</th><th>Total OS</th><th>% TEC1</th></tr><tr><td>'+r.length+'</td><td>'+r.reduce((a,x)=>a+(+x.totalOS||0),0).toLocaleString('pt-BR')+'</td><td>'+PP(P(r.reduce((a,x)=>a+(+x.padrao||0),0),r.reduce((a,x)=>a+(+x.totalOS||0),0)))+'</td></tr></table></div></section>':'<section class="card empty">Nenhuma base publicada. Adicione os JSONs mensais na pasta dados.</section>'}async function load(){try{let m=await fetch('./dados/manifest.json?t='+Date.now()).then(r=>r.json()),c=$('#competencia');if(!m.arquivos?.length){c.innerHTML='<option>Sem competência publicada</option>';render();return}c.innerHTML=m.arquivos.filter(x=>x.ativo!==false).map(x=>`<option value="${x.competencia}">${x.rotulo||x.competencia}</option>`).join('');c.value=m.competenciaAtual;async function month(){let it=m.arquivos.find(x=>x.competencia===c.value&&x.ativo!==false),j=await fetch('./dados/'+it.arquivo+'?t='+Date.now()).then(r=>r.json());ALL=j.dados||[];dims.forEach(([id])=>$('#'+id).value='TODOS');render()}c.onchange=month;await month()}catch(e){$('#competencia').innerHTML='<option>Erro na base</option>';render()}}dims.forEach(([id])=>$('#'+id).onchange=render);$('#reset').onclick=()=>{dims.forEach(([id])=>$('#'+id).value='TODOS');render()};load();</script></body></html>
