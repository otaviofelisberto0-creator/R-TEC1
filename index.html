</style></head><body><header><b class="brandTitle">Dashboard TEC1</b><div class="competenciaBox"><label for="competencia">Competência</label><select id="competencia"><option>Carregando...</option></select><span id="meta"></span></div></header><div class="layout" id="layout"><aside class="side"><button id="menu">☰ <span class="txt">Menu</span></button><button>▣ <span class="txt">TEC1</span></button><a class="repoAdmin" href="./admin.html">⚙ <span class="txt">Admin</span></a></aside><main class="main"><h1>Análise diária TEC1</h1><section class="filterSection"><h2 class="serviceTitle">Filtros de serviço</h2><div class="filters"><label>Grupo OS (UN_RESP)<select id="fOS"></select></label><label>Tipo de Instalação<select id="fTipo"></select></label></div></section><section class="filterSection"><h2 class="serviceTitle">Filtros operacionais interligados</h2><p class="filterHelp">Grupo, Cluster, SubCluster, Cidade, UN e EPO podem ser escolhidos em qualquer ordem e são atualizados em conjunto.</p><div class="filters"><label>Grupo<select id="fGrupo"></select></label><label>Cluster<select id="fCluster"></select></label><label>SubCluster<select id="fSub"></select></label><label>Cidade<select id="fCidade"></select></label><label>UN<select id="fUn"></select></label><label>EPO<select id="fEpo"></select></label><label>Ações<button id="reset">Limpar todos os filtros</button></label></div><div id="activeFilters" class="activeFilters"></div></section><section class="kpis" id="kpis"></section><div id="charts"></div><div id="matrices"></div><section class="grid2"><article class="card"><h3>UNs com menor % TEC1</h3><table class="simple" id="low"></table></article><article class="card"><h3>Top unidades por volume de OS</h3><table class="simple" id="top"></table></article></section></main></div><script>
const labelPlugin={id:'labels',afterDatasetsDraw(c){let{x,ctx,chartArea}=c;ctx.save();c.data.datasets.forEach((d,j)=>c.getDatasetMeta(j).data.forEach((p,i)=>{let v=d.data[i];if(v==null)return;let t=v.toFixed(1).replace('.',',')+'%';ctx.font='900 14px Segoe UI';ctx.fillStyle=d.borderColor;ctx.textAlign='center';ctx.fillText(t,p.x,Math.max(chartArea.top+8,p.y-14-j*18))}));ctx.restore()}};Chart.register(labelPlugin);let ALL=[],HIST=[],META={},CH={};const $=s=>document.querySelector(s),P=(a,b)=>b?100*a/b:null,F=n=>Number(n||0).toLocaleString('pt-BR'),PP=v=>v==null?'-':v.toFixed(1).replace('.',',')+'%';const serviceDims=[['fOS','grupoOrdemServico'],['fTipo','tipoInstalacao']],linkedDims=[['fGrupo','regional'],['fCluster','cluster'],['fSub','subcluster'],['fCidade','cidade'],['fUn','un'],['fEpo','epo']],dims=[...serviceDims,...linkedDims];const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();const normId=v=>String(v??'').trim().replace(/\.0$/,'');function normalizeRow(r){let unResp=norm(r.unResp??r.UN_RESP??r.grupoOrdemServico??r.GRUPO_ORDEM_SERVICO),grupoOSOriginal=norm(r.grupoOSOriginal??r.GRUPO_OS??r.grupoOS),tipoOS=norm(r.tipoOS??r.TIPO_OS),listaIdOS=normId(r.listaIdOS??r.LISTA_ID_OS),tipo=norm(r.tipoInstalacao??r.TIPO_INSTALACAO);const ehMigracao=unResp==='INSTALACAO'&&grupoOSOriginal==='SERVICOS'&&tipoOS==='MUDANCA DE PACOTE'&&listaIdOS==='24';const ehAdesao=unResp==='INSTALACAO'&&grupoOSOriginal==='INSTALACAO'&&['1','43','51','516'].includes(listaIdOS);if(ehMigracao)tipo='MIGRACAO';else if(ehAdesao)tipo='ADESAO';return{...r,grupoOrdemServico:unResp,unResp,grupoOSOriginal,tipoOS,listaIdOS,tipoInstalacao:tipo,regional:String(r.regional??r.GRUPO??r.REGIONAL??'').trim(),cluster:String(r.cluster??r.CLUSTER??'').trim(),subcluster:String(r.subcluster??r.SUBCLUSTER??'').trim(),cidade:String(r.cidade??r.CIDADE??'').trim(),un:String(r.un??r.UN??'').trim(),epo:String(r.epo??r.EPO??'').trim(),totalOS:+(r.totalOS??r.TOTAL_OS??0)||0,padrao:+(r.padrao??r.PADRAO??0)||0,treinado:+(r.treinado??r.TREINADO??0)||0,complete:+(r.complete??r.COMPLETE??0)||0,notdone:+(r.notdone??r.NOTDONE??0)||0,revisita:+(r.revisita??r.REVISITA??0)||0}}function sel(){return Object.fromEntries(dims.map(([i,f])=>[f,$('#'+i).value||'TODOS']))}
function matches(r,s,skip){return dims.every(([i,f])=>f===skip||s[f]==='TODOS'||r[f]===s[f])}
function rows(skip){let s=sel();return ALL.filter(r=>matches(r,s,skip))}
function optionHtml(v){return `<option value="${String(v).replaceAll('&','&amp;').replaceAll('"','&quot;')}">${v}</option>`}
function available(field,state){return [...new Set(ALL.filter(r=>dims.every(([,f])=>f===field||state[f]==='TODOS'||r[f]===state[f])).map(r=>r[field]).filter(v=>v!=null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'))}function fills(){let changed=true,cycles=0;while(changed&&cycles++<10){changed=false;let state=sel();for(const [id,f] of dims){if(f==='tipoInstalacao')continue;let current=$('#'+id).value||'TODOS',vals=available(f,state);if(current!=='TODOS'&&!vals.includes(current)){ $('#'+id).value='TODOS'; changed=true; }}}let state=sel();for(const [id,f] of dims){if(f==='tipoInstalacao')continue;let e=$('#'+id),old=state[f]||'TODOS',vals=available(f,state);e.innerHTML='<option value="TODOS">Todos</option>'+vals.map(optionHtml).join('');e.value=old==='TODOS'||vals.includes(old)?old:'TODOS'}let t=$('#fTipo'),old=state.tipoInstalacao||'TODOS',types=[...new Set(ALL.map(r=>r.tipoInstalacao).filter(Boolean))].sort();t.disabled=false;t.innerHTML='<option value="TODOS">Todos</option>'+types.map(optionHtml).join('');t.value=old==='TODOS'||types.includes(old)?old:'TODOS'}function chartContext(){let s=sel(),parts=[];if(s.grupoOrdemServico!=='TODOS')parts.push(s.grupoOrdemServico);if(s.tipoInstalacao!=='TODOS')parts.push(s.tipoInstalacao);return parts.length?' - '+parts.join(' - '):''}
function agg(r,f){let m={};r.forEach(x=>{let o=m[x[f]]||(m[x[f]]={n:x[f],t:0,p:0,tr:0,c:0,no:0,re:0});o.t+=+x.totalOS;o.p+=+x.padrao;o.tr+=+x.treinado;o.c+=+x.complete;o.no+=+x.notdone;o.re+=+x.revisita});return Object.values(m)}function chart(id,f,title,max=10){let r=rows(),days=[...new Set(r.map(x=>x.data))].sort(),g=agg(r,f).sort((a,b)=>b.t-a.t).slice(0,max),cs=['#d40032','#0067b9','#8b1538','#e97800','#00856a','#6950a1','#ad6b00','#006b75','#c44601','#555'];let ds=g.map((z,j)=>({label:z.n,borderColor:cs[j%cs.length],backgroundColor:cs[j%cs.length],data:days.map(d=>{let q=r.filter(x=>x[f]===z.n&&x.data===d);return P(q.reduce((a,x)=>a+x.padrao,0),q.reduce((a,x)=>a+x.totalOS,0))}),tension:.15,borderWidth:3,pointRadius:5,pointHoverRadius:8}));let cv=document.createElement('canvas');let art=document.createElement('article');art.className='card';art.innerHTML=`<button class="collapse">Recolher</button><h3>${title}${chartContext()}</h3><div class="inside chart"></div>`;art.querySelector('.inside').appendChild(cv);art.querySelector('.collapse').onclick=()=>art.classList.toggle('collapsed');$('#charts').appendChild(art);new Chart(cv,{type:'line',data:{labels:days.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),datasets:ds},options:{maintainAspectRatio:false,responsive:true,layout:{padding:{top:78,right:20}},plugins:{legend:{position:'bottom',labels:{font:{size:15,weight:'700'},padding:20,usePointStyle:true}},tooltip:{titleFont:{size:16},bodyFont:{size:16},padding:13}},scales:{x:{ticks:{font:{size:14,weight:'600'}}},y:{ticks:{font:{size:14,weight:'700'},callback:v=>v+'%'},suggestedMin:75,suggestedMax:100}}}})}function historyRows(){let s=sel();return HIST.filter(r=>dims.every(([i,f])=>s[f]==='TODOS'||r[f]===s[f]))}
function monthLabel(comp){let [y,m]=comp.split('-'),names=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];return (names[Number(m)-1]||m)+'/'+String(y).slice(-2)}
function currentAccumLabel(){if(META.rotuloAcumuladoAtual)return META.rotuloAcumuladoAtual;let comp=META.competenciaAtual||'',m=comp.split('-')[1],names=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];return 'ACUM. '+(names[Number(m)-1]||'ATUAL')}
function availableMonths(pr){let listed=(META.mesesFechados||[]).map(x=>typeof x==='string'?x:x.competencia),found=[...new Set(pr.map(x=>x.competencia).filter(Boolean))];return [...new Set([...listed,...found])].sort()}
function matrix(f,title,second){let r=rows(),pr=historyRows(),days=[...new Set(r.map(x=>x.data))].sort(),months=availableMonths(pr),names=[...new Set([...r.map(x=>x[f]),...pr.map(x=>x[f])])],groups=names.map(n=>{let q=r.filter(x=>x[f]===n);return{n,t:q.reduce((a,x)=>a+(+x.totalOS||0),0),p:q.reduce((a,x)=>a+(+x.padrao||0),0)}}).sort((a,b)=>(P(a.p,a.t)??999)-(P(b.p,b.t)??999));let h=`<article class="card"><h3>% TEC1 diário por ${title}${chartContext()}</h3><div class="matrixWrap"><table class="matrix"><tr><th>${title}</th>${second?'<th>EPO</th>':''}${months.map(m=>`<th class="hist">${monthLabel(m)}</th>`).join('')}<th class="acc">${currentAccumLabel()} ↑</th>${days.map(d=>`<th>${d.slice(8,10)}/${d.slice(5,7)}</th>`).join('')}</tr>`;groups.forEach(z=>{let q=r.filter(x=>x[f]===z.n),pq=pr.filter(x=>x[f]===z.n),acc=P(z.p,z.t);h+=`<tr><td>${z.n}</td>${second?`<td>${[...new Set([...q,...pq].map(x=>x.epo).filter(Boolean))].join(', ')}</td>`:''}`;months.forEach(m=>{let mq=pq.filter(x=>x.competencia===m),v=P(mq.reduce((a,x)=>a+(+x.padrao||0),0),mq.reduce((a,x)=>a+(+x.totalOS||0),0));h+=`<td class="${v==null?'':v<95.7?'bad':'good'}">${PP(v)}</td>`});h+=`<td class="${acc==null?'':acc<95.7?'bad':'good'}">${PP(acc)}</td>`;days.forEach(d=>{let a=q.filter(x=>x.data===d),v=P(a.reduce((s,x)=>s+(+x.padrao||0),0),a.reduce((s,x)=>s+(+x.totalOS||0),0));h+=`<td class="${v==null?'':v<95.7?'bad':'good'}">${PP(v)}</td>`});h+='</tr>'});return h+'</table></div></article>'}
function monthlyComparison(){let pr=historyRows(),months=availableMonths(pr),current=META.competenciaAtual||((ALL[0]&&ALL[0].data)||'').slice(0,7),allMonths=[...months,current].filter(Boolean),groups=['RPS','Grupo SC','Grupo PR'];let value=(month,group)=>{let src=month===current?ALL:pr.filter(x=>x.competencia===month),s=sel();src=src.filter(r=>dims.every(([i,f])=>{if(f==='regional')return group==='RPS'||r.regional===group;return s[f]==='TODOS'||r[f]===s[f]}));return P(src.reduce((a,x)=>a+(+x.padrao||0),0),src.reduce((a,x)=>a+(+x.totalOS||0),0))};let body=groups.map(g=>`<tr><td>${g}</td>${allMonths.map(m=>`<td>${PP(value(m,g))}</td>`).join('')}</tr>`).join('');return `<article class="card"><h3>Comparativo mês x mês${chartContext()}</h3><p>Fechamentos históricos e acumulado da competência atual, respeitando os filtros e mantendo RPS, Grupo SC e Grupo PR.</p><div class="matrixWrap"><table class="simple monthCompare"><tr><th>Visão</th>${allMonths.map(m=>`<th>${m===current?currentAccumLabel():monthLabel(m)}</th>`).join('')}</tr>${body}</table></div></article>`}
function fixedRows(group){let s=sel();return ALL.filter(r=>dims.every(([i,f])=>{if(f==='regional')return group==='RPS'||r.regional===group;return s[f]==='TODOS'||r[f]===s[f]}))}function kpiTec1(group){let r=fixedRows(group),t=r.reduce((a,x)=>a+(+x.totalOS||0),0),p=r.reduce((a,x)=>a+(+x.padrao||0),0);return PP(P(p,t))}function render(){fills();let st=sel(),names={grupoOrdemServico:'Grupo OS (UN_RESP)',tipoInstalacao:'Tipo de Instalação',regional:'Grupo',cluster:'Cluster',subcluster:'SubCluster',cidade:'Cidade',un:'UN',epo:'EPO'};$('#activeFilters').innerHTML=Object.entries(st).filter(([,v])=>v!=='TODOS').map(([f,v])=>`<button class="filterChip" data-field="${f}">${names[f]}: ${v} ×</button>`).join('');document.querySelectorAll('.filterChip').forEach(b=>b.onclick=()=>{let d=dims.find(([,f])=>f===b.dataset.field);if(d)$('#'+d[0]).value='TODOS';render()});let r=rows(),cards=[['RPS x % TEC1',kpiTec1('RPS')],['Grupo SC x % TEC1',kpiTec1('Grupo SC')],['Grupo PR x % TEC1',kpiTec1('Grupo PR')]];$('#kpis').innerHTML=cards.map(c=>`<div class="kpi"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('');$('#charts').innerHTML='';chart('g','regional','Grupo SC x Grupo PR',2);chart('s','subcluster','TEC1 por SubCluster');chart('c','cidade','TEC1 por Cidade');chart('e','epo','TEC1 por EPO');chart('u','un','TEC1 por UN');$('#matrices').innerHTML=monthlyComparison()+matrix('cluster','Cluster')+matrix('epo','EPO')+matrix('un','UN',true);let a=agg(r,'un'),row=x=>`<tr><td>${x.n}</td><td>${PP(P(x.p,x.t))}</td></tr>`;$('#low').innerHTML='<tr><th>UN</th><th>% TEC1</th></tr>'+a.slice().sort((x,y)=>P(x.p,x.t)-P(y.p,y.t)).slice(0,12).map(row).join('');$('#top').innerHTML='<tr><th>UN</th><th>% TEC1</th></tr>'+a.slice().sort((x,y)=>y.t-x.t).slice(0,12).map(row).join('')}dims.forEach(([i,f])=>$('#'+i).onchange=()=>{render()});$('#reset').onclick=()=>{dims.forEach(([i])=>$('#'+i).value='TODOS');render()};$('#menu').onclick=()=>$('#layout').classList.toggle('open');async function carregarCatalogo(){try{let man=await fetch('./dados/manifest.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}),c=$('#competencia'),ativos=(man.arquivos||[]).filter(x=>x.ativo!==false);if(!ativos.length){c.innerHTML='<option>Sem competência</option>';$('#meta').textContent='Base não encontrada';render();return}c.innerHTML=ativos.map(x=>`<option value="${x.competencia}">${x.rotulo||x.competencia}</option>`).join('');c.value=man.competenciaAtual||ativos[ativos.length-1].competencia;async function carregar(){let item=ativos.find(x=>x.competencia===c.value)||ativos[0],j=await fetch('./dados/'+item.arquivo+'?t='+Date.now()).then(r=>r.json());ALL=(j.dados||[]).map(normalizeRow);META=j.metadata||{competenciaAtual:item.competencia};HIST=(j.historicoMensal||[]).map(normalizeRow);$('#meta').textContent=item.rotulo||item.competencia;dims.forEach(([i])=>$('#'+i).value='TODOS');render()}c.onchange=carregar;await carregar()}catch(e){$('#competencia').innerHTML='<option>Erro</option>';$('#meta').textContent='Base não encontrada';render()}}carregarCatalogo();
</script></body></html>
